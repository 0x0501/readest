# Personal fork only — not part of upstream CI.
name: Deploy web to Cloudflare Workers

on:
  push:
    branches: [personal]
  workflow_dispatch:

# One deploy at a time; a newer push supersedes an in-flight run.
concurrency:
  group: deploy-personal
  cancel-in-progress: true

jobs:
  # Upstream's checks only run on `main`, so without this the branch deployed
  # with nothing validating it. `ci-personal.yml` is workflow_call-only, so it
  # runs once here rather than racing a push-triggered copy of itself.
  checks:
    uses: ./.github/workflows/ci-personal.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # foliate-js and simplecc-wasm carry the pdfjs / opencc assets that
          # `setup-vendors` copies into public/vendor, and js-mdict is consumed
          # as TS source through tsconfig paths. Recursive matches what the
          # upstream docker-image workflow does.
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # corepack activates the pnpm version pinned by `packageManager` in the
      # root package.json, so this does not drift when upstream bumps it.
      - run: corepack enable

      # `.env.prod` is gitignored, so CI reconstructs it from one secret holding
      # the whole file. Local and CI deploys then run the identical `pnpm
      # deploy`, rather than CI maintaining its own parallel list of variables
      # that drifts from the file everyone else edits.
      - name: Write .env.prod from the ENV_PROD secret
        working-directory: apps/readest-app
        env:
          ENV_PROD: ${{ secrets.ENV_PROD }}
        run: |
          if [ -z "$ENV_PROD" ]; then
            echo "::error::the ENV_PROD secret is empty — see apps/readest-app/.env.prod.example"
            exit 1
          fi
          printf '%s' "$ENV_PROD" > .env.prod

      - name: Fail fast on missing deployment config
        working-directory: apps/readest-app
        # Each of these fails in a way that does not look like a config problem.
        # A wrong NEXT_PUBLIC_WEB_BASE_URL leaves the site working and every
        # sign-in returning 403 INVALID_ORIGIN. A missing BETTER_AUTH_SECRET
        # makes Better Auth throw on the first request. An empty
        # SIGNUP_ALLOWED_EMAILS admits nobody, so on a fresh database the
        # operator cannot create their own account. Missing R2 credentials leave
        # a site that reads fine and cannot upload a book.
        run: |
          missing=0
          for v in NEXT_PUBLIC_WEB_BASE_URL NEXT_PUBLIC_API_BASE_URL BETTER_AUTH_SECRET \
                   SIGNUP_ALLOWED_EMAILS R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if ! grep -qE "^$v=.+" .env.prod; then
              echo "::error::$v is missing or empty in .env.prod"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - run: pnpm install --frozen-lockfile

      - name: Copy pdfjs / simplecc / jieba assets into public/vendor
        run: pnpm --filter @readest/readest-app setup-vendors

      # Must come first: the web Worker declares a SHARE_OG service binding,
      # and Cloudflare rejects a deploy whose binding names a Worker that does
      # not exist yet. Redeploying an unchanged renderer is a no-op upload.
      - name: Deploy the share-og renderer
        working-directory: apps/readest-app/workers/share-og
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy

      # `pnpm deploy` reads .env.prod itself — the build for the NEXT_PUBLIC_*
      # values it bakes into the bundle, then `wrangler deploy --secrets-file`
      # for the Worker's runtime secrets.
      - name: Build and deploy
        working-directory: apps/readest-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # `run deploy`, not `pnpm deploy` — the latter resolves to pnpm's own
        # built-in deploy command instead of the package script.
        #
        # The script seds `next build"` into `next build --webpack"` before
        # building and restores it afterwards. Do not change the tail of the
        # `build` script: the sed stops matching, the build silently falls back
        # to Turbopack, and the worker grows past the 64 MiB limit.
        run: pnpm run deploy
