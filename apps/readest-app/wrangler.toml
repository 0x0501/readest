name = "readest-web"
main = ".open-next/worker.js"
compatibility_date = "2026-04-10"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[[routes]]
pattern = "read.sumku.cc/*"
zone_name = "sumku.cc"

[vars]
PNPM_VERSION = "10.28.1"

# Server-side runtime config. Non-secret only — account IDs and keys are set
# with `wrangler secret put`: BETTER_AUTH_SECRET, GITHUB_CLIENT_SECRET, R2_ACCOUNT_ID,
# R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY.
OBJECT_STORAGE_TYPE = "r2"
R2_REGION = "auto"
R2_BUCKET_NAME = "readest-files"
TEMP_STORAGE_PUBLIC_BUCKET_NAME = "readest-public"
# Quota ceilings the plan tiers would otherwise impose. 100 GiB of storage and
# 10 M characters of translation per day — high enough not to bind in practice,
# low enough to notice runaway R2 usage.
STORAGE_FIXED_QUOTA = "107374182400"
TRANSLATION_FIXED_QUOTA = "10485760"

# Every request, not a sample. Failures now tell the caller only that something
# went wrong (ADR-019), so the log is the only place the reason exists — and a
# 1% sample means the one failure worth reading is almost certainly the 99 that
# were dropped. This is a single-operator instance; the volume is not the kind
# sampling exists for.
[observability]
enabled = true
head_sampling_rate = 1.0
logs = { head_sampling_rate = 1.0 }
traces = { head_sampling_rate = 1.0 }

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Postgres, reached through Hyperdrive so the Worker holds no direct connection
# and the database can live anywhere. `id` comes from
# `wrangler hyperdrive create readest-db --connection-string=…`.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "fe2eeafa8f554a8aad8313cc5a0f51d1"
# Only ever used by the local emulator, never by the deployed Worker — but
# `opennextjs-cloudflare deploy` reads the Worker env through a miniflare
# instance, and miniflare refuses to construct a Hyperdrive binding without
# somewhere local to point it. Nothing connects to this during a deploy; it
# only has to parse. Override it for real local work with
# CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE.
localConnectionString = "postgresql://postgres:postgres@127.0.0.1:5432/postgres"

# Outbound mail, used only by the password-reset flow (ADR-016). The `from`
# address in AUTH_EMAIL_FROM has to sit on a domain onboarded with
# `wrangler email sending enable <domain>`, or every send returns
# E_SENDER_NOT_VERIFIED. Nothing else here sends mail — `workers/send-email` is
# the inbound Email Routing Worker and is unrelated.
[[send_email]]
name = "EMAIL"

# Required by the r2IncrementalCache override registered in open-next.config.ts,
# even though `dangerous.disableIncrementalCache` keeps it unused at runtime.
# The bucket still has to exist — wrangler validates bindings at deploy time.
[[r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "readest-next-inc-cache"

# Share unfurl cards. The renderer carries satori's 1.3 MB resvg.wasm, which
# would otherwise ride along in every deploy of this Worker; it has no route of
# its own, so this binding is the only way to reach it. Deploy
# `workers/share-og` before this Worker — a binding to a Worker that does not
# exist yet fails the deploy.
[[services]]
binding = "SHARE_OG"
service = "readest-share-og"

# TRANSLATIONS_KV (DeepL response cache) is dropped: this deployment configures
# no DeepL key, and the binding is optional at the call site.
