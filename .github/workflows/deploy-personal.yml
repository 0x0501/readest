# Personal fork only — not part of upstream CI.
name: Deploy web to Cloudflare Workers

on:
  push:
    branches: [personal]
  workflow_dispatch:

# One deploy at a time; a newer push supersedes an in-flight run.
concurrency:
  group: deploy-personal
  cancel-in-progress: true

jobs:
  # Upstream's checks only run on `main`, so without this the branch deployed
  # with nothing validating it. `ci-personal.yml` is workflow_call-only, so it
  # runs once here rather than racing a push-triggered copy of itself.
  checks:
    uses: ./.github/workflows/ci-personal.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # foliate-js and simplecc-wasm carry the pdfjs / opencc assets that
          # `setup-vendors` copies into public/vendor, and js-mdict is consumed
          # as TS source through tsconfig paths. Recursive matches what the
          # upstream docker-image workflow does.
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # corepack activates the pnpm version pinned by `packageManager` in the
      # root package.json, so this does not drift when upstream bumps it.
      - run: corepack enable

      # `.env.prod` is gitignored, so CI composes it from repository secrets and
      # variables. Local and CI deploys then run the identical `pnpm deploy`,
      # which reads the file for both halves of the job: the build bakes the
      # NEXT_PUBLIC_* values into the bundle, `--secrets-file` uploads the rest
      # to the Worker.
      #
      # Only names with a value are written. An empty key is worse than an
      # absent one — wrangler uploads every key it finds, and the code falls
      # back with `??`, which catches undefined but not `''`.
      - name: Compose .env.prod
        working-directory: apps/readest-app
        env:
          NEXT_PUBLIC_WEB_BASE_URL: ${{ vars.NEXT_PUBLIC_WEB_BASE_URL }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_OBJECT_STORAGE_TYPE: r2
          SIGNUP_ALLOWED_EMAILS: ${{ secrets.SIGNUP_ALLOWED_EMAILS }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # Password-reset mail and the captcha in front of the auth endpoints.
          # Required, all three: without the sender the reset flow accepts the
          # request and never delivers, and without the Turnstile pair the auth
          # endpoints are unprotected while the site behaves normally.
          AUTH_EMAIL_FROM: ${{ vars.AUTH_EMAIL_FROM }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          # Optional; defaults to the hostname of NEXT_PUBLIC_WEB_BASE_URL.
          # Changing it invalidates every enrolled passkey (ADR-018).
          PASSKEY_RP_ID: ${{ vars.PASSKEY_RP_ID }}
          # Optional. GitHub refuses secret names beginning with `GITHUB_`, so
          # the OAuth pair is stored under GH_OAUTH_* and renamed here.
          GITHUB_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          NEXT_PUBLIC_PUBLIC_ASSETS_BASE_URL: ${{ vars.NEXT_PUBLIC_PUBLIC_ASSETS_BASE_URL }}
          NEXT_PUBLIC_PUBLIC_STORAGE_BASE_URL: ${{ vars.NEXT_PUBLIC_PUBLIC_STORAGE_BASE_URL }}
          NEXT_PUBLIC_SEND_EMAIL_DOMAIN: ${{ vars.NEXT_PUBLIC_SEND_EMAIL_DOMAIN }}
          DEEPL_PRO_API_KEYS: ${{ secrets.DEEPL_PRO_API_KEYS }}
          DEEPL_FREE_API_KEYS: ${{ secrets.DEEPL_FREE_API_KEYS }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          GOOGLE_BOOKS_API_KEYS: ${{ secrets.GOOGLE_BOOKS_API_KEYS }}
        run: |
          : > .env.prod
          for v in NEXT_PUBLIC_WEB_BASE_URL NEXT_PUBLIC_API_BASE_URL \
                   NEXT_PUBLIC_OBJECT_STORAGE_TYPE SIGNUP_ALLOWED_EMAILS \
                   BETTER_AUTH_SECRET DATABASE_URL \
                   R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY \
                   AUTH_EMAIL_FROM TURNSTILE_SECRET_KEY \
                   NEXT_PUBLIC_TURNSTILE_SITE_KEY PASSKEY_RP_ID \
                   GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET \
                   NEXT_PUBLIC_PUBLIC_ASSETS_BASE_URL NEXT_PUBLIC_PUBLIC_STORAGE_BASE_URL \
                   NEXT_PUBLIC_SEND_EMAIL_DOMAIN \
                   DEEPL_PRO_API_KEYS DEEPL_FREE_API_KEYS AI_GATEWAY_API_KEY \
                   GOOGLE_BOOKS_API_KEYS; do
            value="${!v}"
            [ -n "$value" ] || continue
            # Single-quoted so a `#` in a password does not start a comment and
            # a `\n` is not expanded. A value containing a single quote cannot be
            # encoded this way, so say so rather than write a corrupt file.
            case "$value" in
              *"'"*) echo "::error::$v contains a single quote, which cannot be encoded here"; exit 1 ;;
            esac
            printf "%s='%s'\n" "$v" "$value" >> .env.prod
          done

      # The same check `pnpm deploy` runs locally, so a missing secret fails here
      # rather than on whichever machine happens to deploy. It names what each
      # value does, because none of them fail in a way that looks like a
      # configuration problem.
      - name: Fail fast on missing deployment config
        working-directory: apps/readest-app
        run: pnpm check-env-prod

      - run: pnpm install --frozen-lockfile

      - name: Copy pdfjs / simplecc / jieba assets into public/vendor
        run: pnpm --filter @readest/readest-app setup-vendors

      # Must come first: the web Worker declares a SHARE_OG service binding,
      # and Cloudflare rejects a deploy whose binding names a Worker that does
      # not exist yet. Redeploying an unchanged renderer is a no-op upload.
      - name: Deploy the share-og renderer
        working-directory: apps/readest-app/workers/share-og
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy

      # `pnpm deploy` reads .env.prod itself — the build for the NEXT_PUBLIC_*
      # values it bakes into the bundle, then `wrangler deploy --secrets-file`
      # for the Worker's runtime secrets.
      - name: Build and deploy
        working-directory: apps/readest-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # `run deploy`, not `pnpm deploy` — the latter resolves to pnpm's own
        # built-in deploy command instead of the package script.
        #
        # The script seds `next build"` into `next build --webpack"` before
        # building and restores it afterwards. Do not change the tail of the
        # `build` script: the sed stops matching, the build silently falls back
        # to Turbopack, and the worker grows past the 64 MiB limit.
        run: pnpm run deploy
