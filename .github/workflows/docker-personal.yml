# Personal fork only — not part of upstream CI.
#
# A push to `personal` does not build an image. Pushing one of these tags does,
# and the image tag is the git tag unchanged:
#   web-2026.10.03
#   web-2026.10.03.01
#   web-2026-10.03.01
#
# There is no database in the image. Point DATABASE_URL at the cloud Postgres
# when the container starts.
name: Publish personal image

on:
  push:
    tags:
      - "web-[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]"
      - "web-[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].[0-9][0-9]"
      - "web-[0-9][0-9][0-9][0-9]-[0-9][0-9].[0-9][0-9].[0-9][0-9]"

concurrency:
  group: docker-personal-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: build and push
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The web build needs foliate-js (pdf.js assets), simplecc-wasm (the
      # committed dist/) and js-mdict (imported as TypeScript). The desktop
      # submodules are not part of this image.
      - name: Init web submodules
        run: |
          git submodule update --init --depth 1 \
            packages/foliate-js \
            packages/simplecc-wasm \
            packages/js-mdict \
            apps/readest-app/src-tauri/plugins/tauri-plugin-turso

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        run: |
          owner=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/readest" >> "$GITHUB_OUTPUT"

      - name: Image tag
        id: tag
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            web-[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]|\
            web-[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].[0-9][0-9]|\
            web-[0-9][0-9][0-9][0-9]-[0-9][0-9].[0-9][0-9].[0-9][0-9]) ;;
            *)
              echo "::error::tag must look like web-2026.10.03, web-2026.10.03.01, or web-2026-10.03.01"
              exit 1
              ;;
          esac
          echo "name=${tag}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${{ steps.image.outputs.name }}:${tag}"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.name }}

      # Next inlines NEXT_PUBLIC_* into the server bundle. An empty string is
      # worse than leaving the arg unset: the app's `??` fallback does not
      # treat '' as missing. Dockerfile.personal drops empty values.
      #
      # NEXT_PUBLIC_WEB_BASE_URL is the one that has to be real. Better Auth
      # compares the request Origin to it, and the comparison uses the value
      # baked here, not a variable read on container start.
      - name: Require the public origin
        env:
          NEXT_PUBLIC_WEB_BASE_URL: ${{ vars.NEXT_PUBLIC_WEB_BASE_URL }}
        run: |
          if [ -z "$NEXT_PUBLIC_WEB_BASE_URL" ]; then
            echo "::error::vars.NEXT_PUBLIC_WEB_BASE_URL is empty. The image would bake https://web.readest.com into Better Auth and reject every sign-in."
            exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.personal
          target: production
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-personal
          cache-to: type=gha,scope=docker-personal,mode=max
          build-args: |
            NODE_BUILD_MEMORY=8192
            NEXT_PUBLIC_WEB_BASE_URL=${{ vars.NEXT_PUBLIC_WEB_BASE_URL }}
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_OBJECT_STORAGE_TYPE=${{ vars.NEXT_PUBLIC_OBJECT_STORAGE_TYPE }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_PUBLIC_ASSETS_BASE_URL=${{ vars.NEXT_PUBLIC_PUBLIC_ASSETS_BASE_URL }}
            NEXT_PUBLIC_PUBLIC_STORAGE_BASE_URL=${{ vars.NEXT_PUBLIC_PUBLIC_STORAGE_BASE_URL }}
            NEXT_PUBLIC_SEND_EMAIL_DOMAIN=${{ vars.NEXT_PUBLIC_SEND_EMAIL_DOMAIN }}

      - name: Published image
        run: |
          echo "## Image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "linux/amd64. No database in the image. Set DATABASE_URL, BETTER_AUTH_SECRET, and the R2 credentials on the container." >> "$GITHUB_STEP_SUMMARY"
